<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#060015" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <title>Party Game Hub — Controller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap"
    rel="stylesheet"
  />
  <script src="https://www.airconsole.com/api/airconsole-1.8.0.js"></script>
</head>
<body>

  <!-- "你上場了！" Notification (shared, shown briefly on activation) -->
  <div id="you-are-up" class="hidden">你上場了！</div>

  <!-- Connecting -->
  <div id="waiting">
    <p>Connecting…</p>
  </div>

  <!-- Host transfer request (shown to current host only) -->
  <div id="host-request" class="hidden">
    <div class="host-request-box">
      <p id="host-request-text"></p>
      <div class="host-request-actions">
        <button class="primary-btn" id="host-approve-btn">同意</button>
        <button class="secondary-btn" id="host-deny-btn">拒絕</button>
      </div>
    </div>
  </div>

  <!-- Transient toast (e.g. host denied your request) -->
  <div id="ctrl-toast" class="hidden"></div>

  <!-- In-game back-to-game-select (host only, two-tap confirm) -->
  <button id="ingame-back-btn" class="hidden"> 重選遊戲</button>

  <!-- LOBBY: master — the host never carries a team assignment (see
       shared/teams.js), so there's no team badge / member list / switch-team
       button here, unlike lobby-player below. -->
  <div id="lobby-master" class="hidden">
    <p class="role-tag">房主</p>
    <p class="hint">你負責主持，不會被分配到任何隊伍</p>
    <p id="lobby-master-count" class="hint"></p>
    <button class="primary-btn" id="start-btn">START</button>
  </div>

  <!-- LOBBY: non-master -->
  <div id="lobby-player" class="hidden">
    <div class="lobby-team-display">
      <div id="lobby-player-team-badge" class="ctrl-team-badge"></div>
      <div id="lobby-player-members" class="ctrl-member-list"></div>
    </div>
    <p id="lobby-player-count" class="hint"></p>
    <button class="secondary-btn switch-team-btn">換隊伍</button>
    <button class="secondary-btn" id="claim-host-btn">申請當房主</button>
    <p class="hint">等待房主開始遊戲…</p>
  </div>

  <!-- GAME SELECT: master sees game list -->
  <div id="game-select-master" class="hidden">
    <div id="team-badge-master" class="team-badge"></div>
    <p class="role-tag">HOST — Pick a game</p>
    <div id="game-select-list"></div>
    <div class="game-select-actions">
      <button class="secondary-btn" id="game-select-random-btn">🎲 隨機開始</button>
      <button class="secondary-btn" id="game-select-back-btn">↩ 重新分隊</button>
    </div>
  </div>

  <!-- GAME SELECT: non-master waits -->
  <div id="game-select-player" class="hidden">
    <div id="team-badge-player" class="team-badge"></div>
    <p class="hint">Host is choosing a game…</p>
  </div>

  <!-- MAP SELECT: master picks map -->
  <div id="map-select-master" class="hidden">
    <div id="team-badge-map" class="team-badge"></div>
    <p class="role-tag">選擇地圖</p>
    <div id="map-select-list"></div>
    <button class="secondary-btn" id="map-select-back-btn">↩ 返回大廳</button>
  </div>

  <!-- MAP SELECT: non-master waits -->
  <div id="map-select-player" class="hidden">
    <div id="team-badge-mapwait" class="team-badge"></div>
    <p class="hint">房主正在選擇地圖…</p>
  </div>

  <!-- PREP: reveal + ready check -->
  <div id="prep-waiting" class="hidden">
    <div class="team-badge"></div>
    <p class="hint">抽籤中…</p>
  </div>

  <div id="prep-ready-pending" class="hidden">
    <div class="team-badge"></div>
    <p class="prep-drawn-text">你被抽中上場！</p>
    <button class="primary-btn" id="prep-ready-btn">準備好了</button>
  </div>

  <div id="prep-ready-done" class="hidden">
    <div class="team-badge"></div>
    <p class="hint">已準備，等待其他人…</p>
    <p id="prep-ready-count" class="hint"></p>
  </div>

  <div id="prep-watching" class="hidden">
    <div class="team-badge"></div>
    <p class="hint">這回合輪空，幫忙加油！</p>
  </div>

  <!-- PREP: host-only override panel (persistent overlay, same treatment
       as #ingame-back-btn — shown regardless of which of the 4 views above
       the host is also seeing as a participant) -->
  <div id="prep-host-panel" class="hidden">
    <p class="role-tag">房主控制</p>
    <div id="prep-roster-list"></div>
    <button class="primary-btn" id="prep-force-start-btn">強制開始</button>
  </div>

  <!-- TUTORIAL: every playing device browses its own copy of the how-to-play
       picture book independently — persistent overlay (same treatment as
       #ingame-back-btn), layered on top of the normal game controls whose
       real A/B buttons flip pages while this is up (see src/controller/main.js). -->
  <div id="tutorial-reader" class="hidden">
    <p class="tutorial-reader-title">教學說明</p>
    <img id="tutorial-reader-img" alt="教學圖說" />
    <p id="tutorial-reader-counter"></p>
    <p id="tutorial-reader-hint" class="hint"></p>
  </div>

  <!-- Shown instead of the reader once this device has flipped through to
       the end and reported ready, while others are still catching up. -->
  <div id="tutorial-waiting" class="hidden">
    <p class="hint">
      看完了，等待其他人…</p>
  </div>

  <!-- PLAYING: layout injected dynamically (active players) -->
  <div id="controls" class="hidden">
    <div id="team-badge-controls" class="team-badge team-badge--small"></div>
    <!-- game layout mounts here -->
    <div id="layout-root"></div>

    <!-- Tap-to-open control legend for the currently mounted game — content
         is set per-game in src/controller/main.js from that game's
         controller-layout.js `controls` export (see setControlsHelp). -->
    <button id="controls-help-btn" class="hidden">？</button>
    <div id="controls-help-popup" class="hidden">
      <p class="controls-help-title">操作說明</p>
      <div id="controls-help-list"></div>
    </div>
  </div>

  <!-- CHEERING: watching players during game -->
  <div id="cheering" class="hidden">
    <div id="team-badge-cheer" class="team-badge team-badge--small"></div>
    <p class="cheer-title">為隊友加油！</p>
    <div class="cheer-grid">
      <button class="cheer-btn" data-emoji="fire"><img src="emoji/1.jpg" alt="🔥" /></button>
      <button class="cheer-btn" data-emoji="like"><img src="emoji/2.jpg" alt="👍" /></button>
      <button class="cheer-btn" data-emoji="cheer"><img src="emoji/3.jpg" alt="🙌" /></button>
      <button class="cheer-btn" data-emoji="party"><img src="emoji/4.jpg" alt="🎉" /></button>
      <button class="cheer-btn" data-emoji="star"><img src="emoji/5.jpg" alt="⭐" /></button>
      <button class="cheer-btn" data-emoji="love"><img src="emoji/6.jpg" alt="❤️" /></button>
    </div>
    <div class="cheer-phrases">
      <button class="cheer-phrase-btn" data-text="加油！">加油！</button>
      <button class="cheer-phrase-btn" data-text="衝啊！">衝啊！</button>
      <button class="cheer-phrase-btn" data-text="好樣的！">好樣的！</button>
      <button class="cheer-phrase-btn" data-text="別放棄！">別放棄！</button>
      <button class="cheer-phrase-btn" data-text="太強了！">太強了！</button>
      <button class="cheer-phrase-btn" data-text="反擊啊！">反擊啊！</button>
    </div>
    <form id="cheer-text-form" class="cheer-text-form">
      <input id="cheer-text-input" class="cheer-text-input" type="text" maxlength="16" placeholder="自己打字應援…" autocomplete="off" />
      <button type="submit" class="cheer-text-send">送出</button>
    </form>
    <p class="cheer-hint">你的隊友正在比賽</p>
  </div>

  <!-- RESULTS: master -->
  <div id="results-master" class="hidden">
    <p class="role-tag">HOST</p>
    <button class="primary-btn" id="play-again-btn">重選遊戲</button>
  </div>

  <!-- RESULTS: non-master -->
  <div id="results-player" class="hidden">
    <p class="hint">Waiting for host…</p>
  </div>

  <script type="module" src="/src/controller/main.js"></script>
</body>
</html>
