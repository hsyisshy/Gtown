<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Party Game Hub — Screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap"
    rel="stylesheet"
  />
  <script src="https://www.airconsole.com/api/airconsole-1.8.0.js"></script>
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- OPENING VIDEO: one-time splash, dismissed by the button, then never shown again -->
  <div id="view-intro">
    <video id="intro-video" src="Game_opening.mp4" playsinline></video>
    <button id="intro-replay-btn">重播</button>
    <button id="intro-start-btn" class="primary-btn">開始遊戲</button>
  </div>

  <div id="ui-overlay">

    <!-- LOBBY: title is baked into the lobby_bd.png background art -->
    <div id="view-lobby">
      <p id="player-count"></p>
      <div id="team-columns">
        <div class="team-col">
          <div class="team-col-header red">🔴 紅隊</div>
          <div class="team-col-list" id="team-red-list"></div>
        </div>
        <div class="team-col">
          <div class="team-col-header blue">🔵 藍隊</div>
          <div class="team-col-list" id="team-blue-list"></div>
        </div>
      </div>
      <p id="lobby-hint"></p>
    </div>

    <!-- GAME SELECT -->
    <div id="view-game-select" class="hidden">
      <h2>CHOOSE A GAME</h2>
      <div id="game-select-scores" class="cumulative-scores"></div>
      <p class="subtitle" id="game-select-subtitle">Host is picking…</p>
      <div id="game-grid"></div>
      <button id="random-pick-btn" class="primary-btn">🎲 隨機開始</button>
    </div>

    <!-- MAP SELECT -->
    <div id="view-map-select" class="hidden">
      <h2 id="map-select-game-title"></h2>
      <p class="subtitle">房主選擇地圖中…</p>
      <div id="map-grid"></div>
    </div>

    <!-- PREP: reveal each team's picks, then wait for everyone drawn to
         tap 準備 before the match actually begins -->
    <div id="view-prep" class="hidden">
      <h2>賽前準備</h2>
      <div id="prep-teams">
        <div class="prep-team-box team-red">
          <div class="prep-team-header">🔴 紅隊</div>
          <div class="prep-reels" id="prep-reels-red"></div>
        </div>
        <div class="prep-team-box team-blue">
          <div class="prep-team-header">🔵 藍隊</div>
          <div class="prep-reels" id="prep-reels-blue"></div>
        </div>
      </div>
      <div id="prep-roster"></div>
      <p id="prep-countdown" class="hidden"></p>
    </div>

    <!-- RESULTS -->
    <div id="view-results" class="hidden">
      <h2>RESULTS</h2>
      <div id="results-scoreboard"></div>
      <p id="results-hint"></p>
    </div>

  </div>

  <!-- TUTORIAL: shown when a game starts — gameplay holds until it's
       dismissed. Two mutually-exclusive layouts inside the same panel:
       #tutorial-classic (text goal/controls/tips, or one comic image, with
       a click-to-start button + auto-start countdown) is the original
       format most games still use; #tutorial-paged (a ready-roster — every
       playing device flips through its own copy of the how-to-play picture
       book independently on its own phone) is the newer format for games
       with a tutorial.pages array. -->
  <div id="tutorial-overlay" class="hidden">
    <div id="tutorial-panel">
      <h2 id="tutorial-title"></h2>

      <div id="tutorial-classic">
        <img id="tutorial-comic" class="hidden" alt="" />
        <div class="tut-section">
          <div class="tut-heading">🏆 目標</div>
          <p id="tutorial-goal"></p>
        </div>
        <div class="tut-section">
          <div class="tut-heading">🎮 操作</div>
          <div id="tutorial-controls"></div>
        </div>
        <div class="tut-section" id="tutorial-tips-section">
          <div class="tut-heading">💡 小撇步</div>
          <div id="tutorial-tips"></div>
        </div>
        <button class="primary-btn" id="tutorial-start-btn">開始！</button>
        <p id="tutorial-countdown"></p>
      </div>

      <div id="tutorial-paged" class="hidden">
        <p class="tutorial-roster-hint">📱 教學漫畫在大家自己的手機上，翻到最後一頁按 Ⓑ 準備開始！</p>
        <div id="tutorial-roster"></div>
        <p id="tutorial-roster-countdown" class="hidden"></p>
      </div>
    </div>
  </div>

  <!-- SETTINGS: bottom-right gear — BGM volume lives on this screen, the
       button-SFX volume is broadcast to every controller -->
  <div id="settings-root">
    <div id="settings-panel" class="hidden">
      <h3>設定</h3>
      <label class="setting-row">
        <span class="setting-label">🎵 背景音樂</span>
        <input type="range" id="setting-bgm" min="0" max="100" step="5" />
      </label>
      <label class="setting-row">
        <span class="setting-label">🔔 按鈕音效</span>
        <input type="range" id="setting-sfx" min="0" max="100" step="5" />
      </label>
    </div>
    <button id="home-btn" class="hidden" title="回到主畫面">🏠</button>
    <button id="settings-btn" title="設定">⚙️</button>
  </div>

  <script type="module" src="/src/screen/main.js"></script>
</body>
</html>
